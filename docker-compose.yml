services:
  leanboard:
    build: .
    restart: unless-stopped
    ports:
      - "3010:4000"
    volumes:
      - leanboard-data:/data
    environment:
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-supersecretkey_changeme}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://187.77.224.159:3010}
      - DB_DIR=/data

volumes:
  leanboard-data:
