services:
  app:
    build: .
    container_name: scraper-precios
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data        # persiste la BD SQLite fuera del contenedor
    restart: unless-stopped
    shm_size: "1gb"             # Chromium necesita memoria compartida
