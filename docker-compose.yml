services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal
    # Para debug local descomentá (NO en producción):
    # ports:
    #   - "5432:5432"

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      API_PORT: ${API_PORT}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      STORAGE_DIR: ${STORAGE_DIR}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./storage:/storage
    networks:
      - internal
    # No expone puerto al host: solo accesible vía el proxy nginx del servicio web.
    # ports:
    #   - "8080:8080"

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT}:80"
    networks:
      - internal

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
