name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verificaciones:
    name: Contratos, balance y schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # La paridad de JWT compara la implementación de PHP con la de Node.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, sodium, mbstring

      - name: Instalar dependencias
        run: npm install --ignore-scripts

      - name: Typecheck (shared, tools, client, server)
        run: npm run typecheck

      - name: Paridad de fórmulas, rangos y seeds
        run: npm run check:balance

      # Lo declarado tiene que estar conectado: mensajes de protocolo con
      # handler, endpoints que existen y reglas de juego que el servidor llama.
      # Un typecheck en verde no ve una función que nadie usa; esto sí.
      - name: Cableado — nada declarado y muerto
        run: npm run check:wiring

      - name: JSON Schemas, ejemplos y fachadas reales
        run: npm run validate:schemas

      - name: Regenerar las fachadas emblemáticas y verificar que no cambien
        run: |
          npm run prefabs
          git diff --exit-code -- client/public/prefabs || {
            echo 'Los prefabs generados difieren de los versionados: correr npm run prefabs y commitear.'
            exit 1
          }

      - name: Paridad de JWT entre PHP y Node
        run: npm run test:jwt

      # Bancas, error muestral y k-anonimato, y que PHP y TypeScript den lo mismo.
      - name: Cuentas del Motor de Inteligencia
        run: npm run test:intelligence

      - name: Build del cliente 3D
        run: npm run build:client

      - name: Build del servidor de juego
        run: npm run build --workspace server-vps

      - name: Regenerar los seeds y verificar que no cambien
        run: |
          npm run seeds
          npm run seeds --workspace server-vps
          git diff --exit-code -- backend-php/database/seeds || {
            echo 'Los seeds difieren de las constantes y catálogos: correr npm run seeds (raíz y server-vps) y commitear.'
            exit 1
          }

      - name: Multijugador de punta a punta
        run: npm run test:smoke

      # Cientos de duelos completos: falla si la duración se va de la ventana
      # 6-9 turnos o si alguna carta domina el meta.
      - name: Balance del duelo de chicanas
        run: npm run test:debate --workspace server-vps

      # Conteo por persona, k-anonimato del mapa de calor y relay a Hostinger.
      # Incluye el ataque que la auditoría encontró abierto: un cliente que
      # fabrica sujetos para cruzar el umbral de k-anonimato.
      - name: Motor de Inteligencia del shard
        run: npm run test:intel --workspace server-vps

      # El zip de Hostinger tiene que armarse y traer todo lo que hace falta.
      - name: Empaquetado para Hostinger
        run: |
          sudo apt-get install -y zip unzip
          ./tools/deploy/package-hostinger.sh --skip-build
          for requerido in index.html .htaccess assets/ api/ config/ prefabs/ database/schema.sql; do
            if ! unzip -l hostinger-deploy.zip | grep -q " $requerido"; then
              echo "Falta $requerido en el paquete"; exit 1
            fi
          done
          if unzip -l hostinger-deploy.zip | grep -q 'config/local.php'; then
            echo 'El paquete lleva credenciales adentro'; exit 1
          fi
          echo "Paquete completo: $(unzip -l hostinger-deploy.zip | tail -1)"

  base-de-datos:
    name: Esquema MySQL
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: esquel2027
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar el esquema
        run: mysql -h 127.0.0.1 -uroot -pci esquel2027 < backend-php/database/schema.sql

      # `schema.sql` ya está al día con la Fase 3, así que las migraciones sólo se
      # aplican sobre bases viejas. La 0002 es idempotente (sólo hace MODIFY) y se
      # aplica igual para verificar que sigue corriendo; la 0003 agrega columnas y
      # se verifica aparte, contra una base construida sin ellas.
      - name: Aplicar la migración de la Fase 2
        run: mysql -h 127.0.0.1 -uroot -pci esquel2027 < backend-php/database/migrations/0002_registro_rapido.sql

      - name: Aplicar los seeds
        run: |
          for f in backend-php/database/seeds/*.sql; do
            echo "→ $f"
            mysql -h 127.0.0.1 -uroot -pci esquel2027 < "$f"
          done

      - name: Verificar la carga de catálogos
        run: |
          mysql -h 127.0.0.1 -uroot -pci esquel2027 -e "
            SELECT 'rangos' AS tabla, COUNT(*) AS filas FROM rangos
            UNION ALL SELECT 'facciones', COUNT(*) FROM facciones
            UNION ALL SELECT 'cartas_debate', COUNT(*) FROM cartas_debate
            UNION ALL SELECT 'misiones_catalogo', COUNT(*) FROM misiones_catalogo
            UNION ALL SELECT 'items_catalogo', COUNT(*) FROM items_catalogo
            UNION ALL SELECT 'zonas_territorio', COUNT(*) FROM zonas_territorio;"
          test "$(mysql -h 127.0.0.1 -uroot -pci esquel2027 -N -e 'SELECT COUNT(*) FROM rangos')" = "10"
          test "$(mysql -h 127.0.0.1 -uroot -pci esquel2027 -N -e 'SELECT COUNT(*) FROM cartas_debate')" = "24"
          test "$(mysql -h 127.0.0.1 -uroot -pci esquel2027 -N -e 'SELECT COUNT(DISTINCT familia) FROM cartas_debate')" = "6"
          test "$(mysql -h 127.0.0.1 -uroot -pci esquel2027 -N -e 'SELECT COUNT(DISTINCT tipo) FROM misiones_catalogo')" = "10"
          test "$(mysql -h 127.0.0.1 -uroot -pci esquel2027 -N -e 'SELECT COUNT(*) FROM zonas_territorio')" = "5"

      - name: Unicidad de prefab activo por parcela
        run: |
          set +e
          mysql -h 127.0.0.1 -uroot -pci esquel2027 -e "
            INSERT INTO prefabs_edificios (id, parcela_id, celda_col, celda_row, meta, activo)
              VALUES ('prefab:a', 'parcel:C1-R0-P03', 1, 0, '{}', 1);
            INSERT INTO prefabs_edificios (id, parcela_id, celda_col, celda_row, meta, activo)
              VALUES ('prefab:b', 'parcel:C1-R0-P03', 1, 0, '{}', 1);"
          if [ $? -eq 0 ]; then echo 'FALLA: se permitieron dos prefabs activos en la misma parcela'; exit 1; fi
          echo 'OK: la restricción de parcela activa funciona'

      # Base "vieja": se reconstruye el estado anterior a la 0003 deshaciendo la
      # migración, y después se vuelve a aplicar. Si el par ida/vuelta no cierra,
      # la migración no sirve para actualizar una base en producción.
      - name: La migración 0003 va y vuelve
        run: |
          mysql -h 127.0.0.1 -uroot -pci esquel2027 < backend-php/database/migrations/0003_gameplay_fase3.down.sql
          test "$(mysql -h 127.0.0.1 -uroot -pci esquel2027 -N -e "
            SELECT COUNT(*) FROM information_schema.columns
             WHERE table_schema='esquel2027' AND table_name='misiones_catalogo' AND column_name='disputada'")" = "0"
          mysql -h 127.0.0.1 -uroot -pci esquel2027 < backend-php/database/migrations/0003_gameplay_fase3.sql
          test "$(mysql -h 127.0.0.1 -uroot -pci esquel2027 -N -e "
            SELECT COUNT(*) FROM information_schema.columns
             WHERE table_schema='esquel2027' AND table_name='misiones_catalogo' AND column_name='disputada'")" = "1"
          test "$(mysql -h 127.0.0.1 -uroot -pci esquel2027 -N -e 'SELECT COUNT(DISTINCT familia) FROM cartas_debate')" = "6"
          echo 'OK: la 0003 se puede deshacer y volver a aplicar'

      # Igual que la 0003: se deshace y se vuelve a aplicar. Si el par ida/vuelta
      # no cierra, la migración no sirve para actualizar una base en producción.
      - name: La migración 0004 va y vuelve
        run: |
          mysql -h 127.0.0.1 -uroot -pci esquel2027 < backend-php/database/migrations/0004_inteligencia_fase4.down.sql
          test "$(mysql -h 127.0.0.1 -uroot -pci esquel2027 -N -e "
            SELECT COUNT(*) FROM information_schema.tables
             WHERE table_schema='esquel2027' AND table_name='telemetria_lotes'")" = "0"
          mysql -h 127.0.0.1 -uroot -pci esquel2027 < backend-php/database/migrations/0004_inteligencia_fase4.sql
          test "$(mysql -h 127.0.0.1 -uroot -pci esquel2027 -N -e "
            SELECT COUNT(*) FROM information_schema.tables
             WHERE table_schema='esquel2027' AND table_name IN ('telemetria_lotes','admin_sesiones')")" = "2"
          test "$(mysql -h 127.0.0.1 -uroot -pci esquel2027 -N -e "
            SELECT COUNT(*) FROM information_schema.columns
             WHERE table_schema='esquel2027' AND table_name='personajes' AND column_name='barrio'
               AND column_type LIKE '%matadero%'")" = "1"
          echo 'OK: la 0004 se puede deshacer y volver a aplicar'

      # La telemetría entra con su candado de idempotencia.
      - name: Idempotencia del ingest de telemetría
        run: |
          mysql -h 127.0.0.1 -uroot -pci esquel2027 -e "
            INSERT INTO telemetria_lotes (lote_id, origen, eventos)
              VALUES ('22222222-2222-2222-2222-222222222222', 'vps', 3);
            INSERT IGNORE INTO telemetria_lotes (lote_id, origen, eventos)
              VALUES ('22222222-2222-2222-2222-222222222222', 'vps', 3);"
          test "$(mysql -h 127.0.0.1 -uroot -pci esquel2027 -N -e 'SELECT COUNT(*) FROM telemetria_lotes')" = "1"
          echo 'OK: un lote de telemetría repetido no entra dos veces'

      - name: Idempotencia del volcado de stats
        run: |
          mysql -h 127.0.0.1 -uroot -pci esquel2027 -e "
            INSERT INTO sync_lotes (batch_id, shard, personajes, recibido_en)
              VALUES ('11111111-1111-1111-1111-111111111111', 'test', 1, UTC_TIMESTAMP(3));
            INSERT IGNORE INTO sync_lotes (batch_id, shard, personajes, recibido_en)
              VALUES ('11111111-1111-1111-1111-111111111111', 'test', 1, UTC_TIMESTAMP(3));"
          test "$(mysql -h 127.0.0.1 -uroot -pci esquel2027 -N -e 'SELECT COUNT(*) FROM sync_lotes')" = "1"
          echo 'OK: un lote repetido no se aplica dos veces'

  php:
    name: Sintaxis PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: php -l sobre toda la API
        run: find backend-php -name '*.php' -print0 | xargs -0 -n1 php -l
