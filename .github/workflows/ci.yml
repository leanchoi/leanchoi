name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verificaciones:
    name: Contratos, balance y schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm install --ignore-scripts

      - name: Typecheck (shared + tools)
        run: npm run typecheck

      - name: Paridad de fórmulas, rangos y seeds
        run: npm run check:balance

      - name: JSON Schemas y ejemplos
        run: npm run validate:schemas

  base-de-datos:
    name: Esquema MySQL
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: esquel2027
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar el esquema
        run: mysql -h 127.0.0.1 -uroot -pci esquel2027 < backend-php/database/schema.sql

      - name: Aplicar los seeds
        run: |
          for f in backend-php/database/seeds/*.sql; do
            echo "→ $f"
            mysql -h 127.0.0.1 -uroot -pci esquel2027 < "$f"
          done

      - name: Verificar la carga de catálogos
        run: |
          mysql -h 127.0.0.1 -uroot -pci esquel2027 -e "
            SELECT 'rangos' AS tabla, COUNT(*) AS filas FROM rangos
            UNION ALL SELECT 'facciones', COUNT(*) FROM facciones
            UNION ALL SELECT 'cartas_debate', COUNT(*) FROM cartas_debate
            UNION ALL SELECT 'misiones_catalogo', COUNT(*) FROM misiones_catalogo
            UNION ALL SELECT 'items_catalogo', COUNT(*) FROM items_catalogo
            UNION ALL SELECT 'zonas_territorio', COUNT(*) FROM zonas_territorio;"
          test "$(mysql -h 127.0.0.1 -uroot -pci esquel2027 -N -e 'SELECT COUNT(*) FROM rangos')" = "10"

      - name: Unicidad de prefab activo por parcela
        run: |
          set +e
          mysql -h 127.0.0.1 -uroot -pci esquel2027 -e "
            INSERT INTO prefabs_edificios (id, parcela_id, celda_col, celda_row, meta, activo)
              VALUES ('prefab:a', 'parcel:C1-R0-P03', 1, 0, '{}', 1);
            INSERT INTO prefabs_edificios (id, parcela_id, celda_col, celda_row, meta, activo)
              VALUES ('prefab:b', 'parcel:C1-R0-P03', 1, 0, '{}', 1);"
          if [ $? -eq 0 ]; then echo 'FALLA: se permitieron dos prefabs activos en la misma parcela'; exit 1; fi
          echo 'OK: la restricción de parcela activa funciona'
