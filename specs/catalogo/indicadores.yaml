# =============================================================================
# CATÁLOGO DE INDICADORES — FUENTE ÚNICA DE VERDAD
# =============================================================================
# Este archivo es el contrato semántico de todo el ecosistema. De acá se GENERAN
# (specs/scripts/gen_catalogo.py):
#   · web/src/generated/indicadores.ts   -> tipos y metadatos para el tablero
#   · etl/generated/indicadores.py       -> validación de esquemas en emit.py
#   · docs/generated/ficha-metodologica.md -> documentación pública
#
# REGLA DE ORO: si un número aparece en el tablero, tiene una entrada acá. Si no
# tiene entrada, no se muestra. Esto es lo que impide que el tablero se convierta
# en un despelote de métricas con nombres parecidos y definiciones distintas.
#
# REGLA DE ADMISIÓN: para agregar un indicador hay que completar los 14 campos.
# Si no se puede completar `decision`, el indicador no entra: significa que nadie
# va a hacer nada distinto por conocerlo.
#
# NOMENCLATURA
#   sufijo de unidad:     _ars _usd _pct _ratio _idx _dias _pp
#   sufijo de agregación: _med (mediana) _p25 _p75 _min _max _sum
#   prefijo de tabla:     air_ (aéreo) ota_ (Métrica) x_ (cruce) ext_ (oficial)
#   fechas:               fecha (estadía/noche) · flight_date · observed_date
#                         lead_dias · lead_bucket
#
# confianza: A oficial · B scraping con cobertura suficiente · C modelado
#            D insuficiente (no sale del organismo)
# =============================================================================

version_catalogo: 1

indicadores:

# --- FAMILIA: CONECTIVIDAD ---------------------------------------------------

- id: frecuencias_semanales
  nombre: Frecuencias semanales de llegada
  familia: conectividad
  definicion: Vuelos programados que arriban al destino por semana.
  formula: count(vuelos) / semanas
  unidad: vuelos
  grano: [ruta, mes]
  fuentes: [ext_anac_mensual, air_fact_leadtime]
  confianza: A
  cobertura_minima: 1.0
  direccion: alto
  interpretacion: >
    En Esquel NO es constante: 6 semanales de base (diario salvo martes), 7 en
    agosto-septiembre por la ruta COR, y hasta 9 en Tulipanes. Todo indicador
    derivado de capacidad debe ser un PERFIL MENSUAL, nunca un escalar.
  decision: Insumo de negociación de frecuencias y de todo cálculo de capacidad.
  destinatarios: [gestion, lobby]
  doc: docs/02#4
  version: 1

- id: butacas_mes
  nombre: Butacas ofrecidas por mes
  familia: conectividad
  definicion: Asientos comercializables que arriban al destino en el mes.
  formula: frecuencias_semanales * asientos_equipo * 4.33
  unidad: plazas
  grano: [ruta, mes]
  fuentes: [ext_anac_mensual]
  confianza: A
  cobertura_minima: 1.0
  direccion: alto
  interpretacion: ANAC publica butacas reales; no estimar desde el tipo de avión.
  decision: Denominador del factor de ocupación y techo del canal aéreo.
  destinatarios: [gestion, lobby]
  doc: docs/02#4.1
  version: 1

- id: lf_real
  nombre: Factor de ocupación aéreo real
  familia: conectividad
  definicion: Pasajeros transportados sobre butacas ofrecidas.
  formula: pax_aereos / butacas_mes
  unidad: pct
  grano: [ruta, mes]
  fuentes: [ext_anac_mensual]
  confianza: A
  cobertura_minima: 1.0
  direccion: alto
  interpretacion: >
    Dato oficial de ANAC, no inferido por scraping. El umbral 0,80 no es
    estadístico: es el piso contractual del programa de Conectividad Sostenible.
  decision: Dispara el análisis de riesgo fiscal y sustenta pedidos de frecuencia.
  destinatarios: [gestion, lobby, publico]
  doc: docs/07#2
  version: 1

- id: sigma_aereo_pct
  nombre: Cuota estructural máxima del canal aéreo
  familia: conectividad
  definicion: >
    Porcentaje máximo de los pernoctes del mes que el canal aéreo podría aportar
    con los aviones llenos.
  formula: (butacas_mes * lf_max * estadia_media_aerea) / pernoctes_mes
  unidad: pct
  grano: [destino, mes]
  fuentes: [ext_anac_mensual, oit_pernoctes]
  confianza: B
  cobertura_minima: 1.0
  direccion: neutro
  interpretacion: >
    PERFIL MENSUAL, no un número. Con 6 frecuencias base y 9 en Tulipanes, la
    cuota del pico supera en ~50% a la de temporada baja. Define cuánta pauta
    tiene sentido dirigir al canal aéreo en cada mes.
  decision: Fija el reparto estructural de presupuesto entre emisores aéreos y terrestres.
  destinatarios: [gestion]
  doc: docs/02#4.2
  version: 1

- id: isa_idx
  nombre: Índice de Suficiencia Aérea
  familia: conectividad
  definicion: Butacas de llegada por cada 1.000 plazas-noche hoteleras disponibles.
  formula: (butacas_mes * lf_max) / (plazas_hoteleras * dias_mes) * 1000
  unidad: idx
  grano: [destino, mes]
  fuentes: [ext_anac_mensual, oit_plazas]
  confianza: B
  cobertura_minima: 1.0
  direccion: alto
  interpretacion: Mide el desbalance entre inversión hotelera local y conectividad.
  decision: Argumento central del pedido de frecuencias ante ANAC y Aerolíneas.
  destinatarios: [lobby, publico]
  doc: docs/02#4.1
  version: 1

- id: valor_marginal_frecuencia
  nombre: Valor marginal de una frecuencia semanal
  familia: conectividad
  definicion: Pernoctes mensuales adicionales que genera una frecuencia semanal más.
  formula: asientos_equipo * 4.33 * lf_esperado * estadia_media_aerea
  unidad: pernoctes
  grano: [ruta]
  fuentes: [ext_anac_mensual, oit_estadia]
  confianza: C
  cobertura_minima: 1.0
  direccion: alto
  interpretacion: Multiplicado por el gasto diario per cápita da el derrame por frecuencia.
  decision: Convierte "queremos más vuelos" en una propuesta con impacto cuantificado.
  destinatarios: [lobby]
  doc: docs/02#4.3
  version: 1

# --- FAMILIA: COSTO ----------------------------------------------------------

- id: tarifa_rt_med_ars
  nombre: Tarifa aérea ida y vuelta (mediana)
  familia: costo
  definicion: Mediana de tarifa por pasajero, ida y vuelta, dentro de la celda.
  formula: median(price_ars) por (ruta, flight_date, lead_bucket)
  unidad: ars
  grano: [ruta, flight_date, lead_bucket]
  fuentes: [air_fact_leadtime]
  confianza: B
  cobertura_minima: 0.80
  direccion: bajo
  interpretacion: >
    Comparable SOLO dentro de la misma celda de anticipación. Comparar tarifas a
    distinto lead time mide el paso del tiempo, no competitividad.
  decision: Insumo del TTCI y de las alertas de precio.
  destinatarios: [gestion, prestadores]
  doc: docs/02#1
  version: 1

- id: tarifa_km_ars
  nombre: Tarifa por kilómetro
  familia: costo
  definicion: Tarifa mediana dividida por la distancia geodésica.
  formula: tarifa_rt_med_ars / distancia_km
  unidad: ars
  grano: [ruta, mes]
  fuentes: [air_fact_leadtime, air_dim_rutas]
  confianza: C
  cobertura_minima: 0.80
  direccion: bajo
  interpretacion: >
    DESCRIPTIVO Y COMUNICABLE, no probatorio. El costo aéreo no es lineal en la
    distancia. Para evidencia usar ipa_residual_pp.
  decision: Comunicación pública y prensa.
  destinatarios: [publico]
  doc: docs/02#3.1
  version: 1

- id: ipa_residual_pp
  nombre: Sobreprecio aéreo no explicado
  familia: costo
  definicion: >
    Parte de la brecha tarifaria que no explican distancia, competencia ni
    frecuencias, según el modelo hedónico.
  formula: ln(F_eqs/F_ref) - beta1*ln(dist) - beta2*ln(1+n) - beta3*ln(freq)
  unidad: pp
  grano: [ruta, mes]
  fuentes: [air_fact_leadtime, air_dim_rutas]
  confianza: C
  cobertura_minima: 0.80
  direccion: bajo
  interpretacion: >
    Se reporta SIEMPRE junto a los componentes explicados. Conceder lo que tiene
    explicación estructural es lo que vuelve difícil de refutar al residuo.
  decision: Sustento técnico ante ANAC y Secretaría de Transporte.
  destinatarios: [lobby]
  doc: docs/02#3.2
  version: 1

- id: gap_competencia_pp
  nombre: Brecha atribuible a falta de competencia
  familia: costo
  definicion: Contribución del número de operadores a la brecha tarifaria vs benchmark.
  formula: beta2 * ln((1+n_eqs)/(1+n_ref))
  unidad: pp
  grano: [ruta, mes]
  fuentes: [air_fact_leadtime]
  confianza: C
  cobertura_minima: 0.80
  direccion: bajo
  interpretacion: >
    Esquel tiene un operador; Bariloche, tres. Este componente suele dominar y es
    el que cambia el diagnóstico de "Aerolíneas cobra caro" a "la ruta no tiene
    competencia".
  decision: Orienta el reclamo hacia política de competencia, no solo tarifaria.
  destinatarios: [lobby]
  doc: docs/02#3.2
  version: 1

- id: ttci_ars
  nombre: Índice de Costo Total de Viaje
  familia: costo
  definicion: Costo de bolsillo del viaje completo para un grupo y estadía dados.
  formula: pax*tarifa_rt + traslado_grupo + noches*unidades*adr
  unidad: ars
  grano: [destino, gateway, fecha, lead_bucket]
  fuentes: [air_gateway_costs, ota_fact_dia]
  confianza: C
  cobertura_minima: 0.80
  direccion: bajo
  interpretacion: >
    Se calcula en el NAVEGADOR porque depende de parámetros del usuario. El aéreo
    escala con pasajeros y el alojamiento con unidades: nunca sumarlos sin separar
    los escalados.
  decision: Comparación de destinos y diseño de paquetes promocionales.
  destinatarios: [gestion, prestadores, publico]
  doc: docs/02#2.1
  version: 1

- id: ttci_pppn_ars
  nombre: Costo total por persona y por noche
  familia: costo
  definicion: TTCI normalizado, única forma comparable entre grupos y estadías.
  formula: ttci_ars / (pax * noches)
  unidad: ars
  grano: [destino, gateway, fecha]
  fuentes: [air_gateway_costs, ota_fact_dia]
  confianza: C
  cobertura_minima: 0.80
  direccion: bajo
  interpretacion: Métrica titular de competitividad de costo.
  decision: Posicionamiento de precio del destino.
  destinatarios: [gestion, prestadores]
  doc: docs/02#2.1
  version: 1

- id: brecha_paquete_pct
  nombre: Brecha de paquete vs benchmark
  familia: costo
  definicion: Sobrecosto porcentual del paquete de Esquel respecto de Bariloche.
  formula: ttci_esquel / ttci_bariloche - 1
  unidad: pct
  grano: [fecha, lead_bucket]
  fuentes: [air_gateway_costs, ota_fact_dia]
  confianza: C
  cobertura_minima: 0.80
  direccion: bajo
  interpretacion: >
    Al ser un ratio es inmune a la inflación y a la elección de tipo de cambio.
    Por eso es el indicador titular y no la tarifa en pesos.
  decision: Señal S1 del monitor de alerta temprana.
  destinatarios: [gestion]
  doc: docs/02#8.2
  version: 1

- id: n_estrella_noches
  nombre: Umbral de estadía compensatoria
  familia: costo
  definicion: >
    Noches a partir de las cuales la ventaja de precio hotelero de Esquel compensa
    el sobreprecio aéreo frente a Bariloche.
  formula: pax*(costo_pax_eqs - costo_pax_brc) / (unidades*(adr_brc - adr_eqs))
  unidad: noches
  grano: [fecha]
  fuentes: [air_gateway_costs, ota_fact_dia]
  confianza: C
  cobertura_minima: 0.80
  direccion: bajo
  interpretacion: >
    Si supera la estadía media real, la ventaja hotelera NUNCA se materializa para
    el turista típico y el mensaje de "más barato" es falso.
  decision: Segmentación del marketing hacia estadías largas, o replanteo del mensaje.
  destinatarios: [gestion, prestadores]
  doc: docs/02#2.3
  version: 1

- id: ic_compensabilidad
  nombre: Índice de Compensabilidad
  familia: costo
  definicion: ADR que Esquel necesitaría para igualar el paquete, sobre el ADR observado.
  formula: adr_requerido / adr_observado
  unidad: ratio
  grano: [fecha, noches]
  fuentes: [air_gateway_costs, ota_fact_dia]
  confianza: C
  cobertura_minima: 0.80
  direccion: alto
  interpretacion: >
    Por debajo del costo variable de operación, la compensación es IMPOSIBLE: es
    la prueba formal de que el diferencial no es atribuible al sector hotelero.
  decision: Defensa técnica del sector alojamiento local.
  destinatarios: [prestadores, publico]
  doc: docs/02#2.4
  version: 1

- id: ifpe_pct
  nombre: Índice de Fuga de Puerta de Entrada
  familia: costo
  definicion: Proporción de fechas en que llegar a Esquel es más barato por otro aeropuerto.
  formula: fechas_con_gateway_optimo_distinto_de_EQS / fechas_totales
  unidad: pct
  grano: [origen, periodo]
  fuentes: [air_gateway_costs, ota_fact_dia]
  confianza: C
  cobertura_minima: 0.80
  direccion: bajo
  interpretacion: >
    Alto significa que el aeropuerto de Esquel está siendo esquivado por sus
    propios visitantes: la ruta no tiene poca demanda, tiene demanda que se va por
    otra puerta.
  decision: Industrializar el corredor BRC-Esquel, o reclamar paridad tarifaria.
  destinatarios: [gestion, lobby]
  doc: docs/02#2.2
  version: 1

# --- FAMILIA: MERCADO --------------------------------------------------------

- id: adr_med_ars
  nombre: Tarifa diaria promedio (mediana)
  familia: mercado
  definicion: Mediana del precio por unidad-noche publicado en OTA.
  formula: median(price_ars) por (destino, fecha, tipologia)
  unidad: ars
  grano: [destino, fecha, tipologia]
  fuentes: [ota_fact_dia]
  confianza: B
  cobertura_minima: 0.80
  direccion: neutro
  interpretacion: Precio de oferta publicada, no precio transaccionado.
  decision: Benchmarking de precios para prestadores.
  destinatarios: [prestadores, gestion]
  doc: docs/03#2.3
  version: 1

- id: ocupacion_implicita_pct
  nombre: Ocupación implícita OTA
  familia: mercado
  definicion: Proporción de listings observados que ya no están disponibles.
  formula: 1 - listings_disponibles / listings_observados
  unidad: pct
  grano: [destino, fecha, lead_bucket]
  fuentes: [ota_fact_leadtime]
  confianza: C
  cobertura_minima: 0.80
  direccion: alto
  interpretacion: >
    NO es ocupación real: es un proxy de disponibilidad en OTA. Nombrarla siempre
    "implícita" en el tablero para no confundirla con la del OIT ni con la EOH.
  decision: Señal temprana de ritmo de reservas.
  destinatarios: [gestion, prestadores]
  doc: docs/03#2.3
  version: 1

- id: pace_rel_ratio
  nombre: Pace de reservas relativo
  familia: mercado
  definicion: Disponibilidad actual sobre la de referencia a igual anticipación.
  formula: disponibilidad_actual(lead) / disponibilidad_referencia(lead)
  unidad: ratio
  grano: [destino, fecha, lead_bucket]
  fuentes: [ota_fact_leadtime]
  confianza: B
  cobertura_minima: 0.80
  direccion: bajo
  interpretacion: >
    Más disponibilidad de la esperada a igual anticipación es la señal más temprana
    de una temporada floja. Es la única señal que ya se puede calcular hoy con lo
    que Métrica viene capturando.
  decision: Señal S4 del monitor. Dispara promoción antes de que sea tarde.
  destinatarios: [gestion]
  doc: docs/02#8.2
  version: 1

- id: l90_dias
  nombre: Punto de congelamiento de reservas
  familia: mercado
  definicion: Anticipación a la que ya está tomado el 90% de las reservas finales.
  formula: min(lead) tal que reservado(lead) >= 0.90 * reservado_final
  unidad: dias
  grano: [destino, temporada]
  fuentes: [ota_fact_leadtime]
  confianza: C
  cobertura_minima: 0.80
  direccion: alto
  interpretacion: Cualquier campaña lanzada después de este punto llega tarde por definición.
  decision: Fija el calendario operativo de la pauta publicitaria.
  destinatarios: [gestion]
  doc: docs/02#5.2
  version: 1

# --- FAMILIA: DEMANDA --------------------------------------------------------

- id: ocupacion_oit_pct
  nombre: Ocupación hotelera oficial
  familia: demanda
  definicion: Ocupación relevada por el Observatorio, bajo sus reglas de mínimos muestrales.
  formula: definida en etl/indicadores.py
  unidad: pct
  grano: [destino, mes]
  fuentes: [oit_ocupacion]
  confianza: A
  cobertura_minima: 1.0
  direccion: alto
  interpretacion: Variable dependiente de todo el modelo de correlación.
  decision: Evaluación general de la gestión turística.
  destinatarios: [gestion, publico]
  doc: docs/02#7
  version: 1

- id: multiplicador_pernoctes_pax
  nombre: Pernoctes por pasajero aéreo
  familia: demanda
  definicion: Pernoctes totales del mes divididos por pasajeros aéreos llegados.
  formula: pernoctes_mes / pax_aereos_mes
  unidad: ratio
  grano: [destino, mes]
  fuentes: [ext_anac_mensual, oit_pernoctes]
  confianza: B
  cobertura_minima: 1.0
  direccion: neutro
  interpretacion: >
    Con ~100 meses de serie ANAC+OIT se puede medir su estabilidad y estacionalidad.
    Es la traducción empírica entre conectividad y demanda, y reemplaza al supuesto
    de estadía media.
  decision: Calibra el valor marginal por frecuencia y el techo del canal aéreo.
  destinatarios: [gestion, lobby]
  doc: docs/07#3
  version: 1

# --- FAMILIA: RIESGO ---------------------------------------------------------

- id: lf_proyectado_pct
  nombre: Factor de ocupación aéreo proyectado
  familia: riesgo
  definicion: Proyección del LF de una ruta para una semana futura.
  formula: modelo sobre pace de tarifas y disponibilidad, calibrado con lf_real histórico
  unidad: pct
  grano: [ruta, semana_objetivo]
  fuentes: [air_fact_leadtime, ext_anac_mensual]
  confianza: C
  cobertura_minima: 0.80
  direccion: alto
  interpretacion: Se reporta como banda, nunca como punto.
  decision: Insumo del riesgo fiscal del acuerdo de Conectividad Sostenible.
  destinatarios: [gestion]
  doc: docs/07#2
  version: 1

- id: exposicion_fiscal_ars
  nombre: Exposición fiscal del acuerdo de conectividad
  familia: riesgo
  definicion: >
    Monto que la provincia o el municipio debería aportar si el factor de ocupación
    cierra por debajo del piso contractual del 80%.
  formula: max(0, 0.80 - lf_proyectado) * butacas_periodo * tarifa_referencia
  unidad: ars
  grano: [ruta, periodo_acuerdo]
  fuentes: [air_fact_leadtime, ext_anac_mensual]
  confianza: C
  cobertura_minima: 0.80
  direccion: bajo
  interpretacion: >
    Convierte cada punto de ocupación en pesos públicos. Es la métrica que le da
    retorno medible a la inversión en promoción: gastar en pauta para no pagar
    subsidio tiene una relación costo-beneficio calculable.
  decision: >
    Autoriza promoción intensiva de la ruta, o anticipa la previsión
    presupuestaria. Es el producto ancla del observatorio.
  destinatarios: [gestion, lobby]
  doc: docs/07#2
  version: 1

- id: iat_idx
  nombre: Índice de Alerta Temprana
  familia: riesgo
  definicion: Compuesto de brecha de paquete, aceleración tarifaria, capacidad y pace.
  formula: 0.30*S1 + 0.15*S2 + 0.30*S3 + 0.25*S4
  unidad: idx
  grano: [destino, semana_objetivo]
  fuentes: [x_fact_alertas]
  confianza: C
  cobertura_minima: 0.80
  direccion: bajo
  interpretacion: >
    Solo se emite alerta con 21 <= lead <= 75 días. Con cobertura bajo 80% el
    estado es "sin señal", nunca verde.
  decision: Reasignación de pauta y gestión de conectividad.
  destinatarios: [gestion]
  doc: docs/02#8.3
  version: 1

- id: pernoctes_en_riesgo
  nombre: Pernoctes en riesgo
  familia: riesgo
  definicion: Pernoctes que se perderían si el ritmo actual de reservas se sostiene.
  formula: plazas_totales * 7 * max(0, ocupacion_esperada - ocupacion_proyectada)
  unidad: pernoctes
  grano: [destino, semana_objetivo]
  fuentes: [x_fact_alertas, oit_plazas]
  confianza: C
  cobertura_minima: 0.80
  direccion: bajo
  interpretacion: Dimensiona la respuesta; multiplicado por el gasto diario da el derrame en riesgo.
  decision: Define el tamaño de la reasignación presupuestaria.
  destinatarios: [gestion]
  doc: docs/02#8.5
  version: 1

# --- FAMILIA: CALIDAD (meta-indicadores) -------------------------------------

- id: cobertura_captura_pct
  nombre: Cobertura de captura
  familia: calidad
  definicion: Consultas exitosas sobre consultas planificadas en la celda.
  formula: runs_ok / runs_planificados
  unidad: pct
  grano: [ruta, periodo]
  fuentes: [air_scrape_runs]
  confianza: A
  cobertura_minima: 1.0
  direccion: alto
  interpretacion: >
    Ninguna serie se publica sin este número al lado. Bajo 0,80 la serie se marca
    preliminar. Distinguir "no había vuelo" de "no se pudo medir" es lo que separa
    un observatorio de una planilla.
  decision: Habilita o bloquea la publicación de cualquier indicador derivado.
  destinatarios: [gestion, publico]
  doc: docs/01#3
  version: 1

- id: frescura_dias
  nombre: Frescura del dato
  familia: calidad
  definicion: Días transcurridos desde la última actualización exitosa del dataset.
  formula: hoy - ultima_actualizacion_ok
  unidad: dias
  grano: [dataset]
  fuentes: [meta.json]
  confianza: A
  cobertura_minima: 1.0
  direccion: bajo
  interpretacion: >
    ANAC tiene 1-3 meses de rezago por diseño; el scraping, horas. Mostrar siempre
    hasta qué fecha llega cada fuente evita que se lean como contemporáneas.
  decision: Advertencia visible en cada sección del tablero.
