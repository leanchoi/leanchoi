server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # ---------------------------------------------------------------------
    # Tipos MIME
    # ---------------------------------------------------------------------
    # El .wasm DEBE servirse como application/wasm: si sale como
    # application/octet-stream, el navegador rechaza la compilación en
    # streaming y el tablero queda en la pantalla de carga.
    types {
        text/html                             html;
        text/css                              css;
        application/javascript                js mjs;
        application/wasm                      wasm;
        application/vnd.apache.arrow.stream   arrow;
        application/vnd.apache.parquet        parquet;
        application/json                      json map;
        image/svg+xml                         svg;
        image/png                             png;
        image/x-icon                          ico;
        font/woff2                            woff2;
    }
    default_type application/octet-stream;

    # ---------------------------------------------------------------------
    # Compresión
    # ---------------------------------------------------------------------
    # Sin esto el motor de DuckDB viaja en ~33 MB en vez de ~7 MB.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain text/css application/javascript application/json
        image/svg+xml application/wasm
        application/vnd.apache.arrow.stream;

    # Si están los .gz/.br precomprimidos (los genera `make comprimir`), se
    # sirven directamente y nginx se ahorra comprimir en cada request.
    gzip_static on;

    # ---------------------------------------------------------------------
    # Caché
    # ---------------------------------------------------------------------
    # Los assets del build llevan hash en el nombre: son inmutables.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # El dataset se regenera con cada corrida del ETL y conserva el nombre,
    # así que se revalida siempre en vez de cachearse a ciegas.
    location /data/ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA: cualquier ruta desconocida cae en index.html, que nunca se cachea.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # ---------------------------------------------------------------------
    # Encabezados de seguridad
    # ---------------------------------------------------------------------
    # El tablero es totalmente estático y no hace pedidos a terceros: la CSP
    # puede ser estricta. 'wasm-unsafe-eval' es imprescindible para DuckDB.
    add_header X-Content-Type-Options    "nosniff"        always;
    add_header X-Frame-Options           "SAMEORIGIN"     always;
    add_header Referrer-Policy           "same-origin"    always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
